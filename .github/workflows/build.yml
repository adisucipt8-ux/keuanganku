name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Keuanganku-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Keuanganku-apk
          path: Keuanganku-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Keuanganku 1.0.${{ github.run_number }}
          body: |
            Unduh file **Keuanganku-1.0.${{ github.run_number }}.apk** di bawah, lalu buka di HP Android untuk memasang.
            Kalau sudah terpasang versi sebelumnya, cukup pasang yang baru — data tetap aman.
          files: Keuanganku-*.apk
          make_latest: true
