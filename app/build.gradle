plugins {
    id 'com.android.application'
}

def buildNumber = Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')

android {
    namespace 'id.adi.keuanganku'
    compileSdk 34

    defaultConfig {
        applicationId 'id.adi.keuanganku'
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    signingConfigs {
        release {
            storeFile file('../keystore/keuanganku.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'keuanganku'
            keyAlias 'keuanganku'
            keyPassword System.getenv('KEYSTORE_PASSWORD') ?: 'keuanganku'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
